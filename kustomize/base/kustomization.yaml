apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# ------------------------------------------------------------------------------
# 📦 Kubernetes Workloads (PostgreSQL StatefulSet + Secrets)
# ------------------------------------------------------------------------------

resources:
  - ../../k8s/base/postgres-statefulset.yaml
  - ../../k8s/base/postgres-secret.yaml
  
# ------------------------------------------------------------------------------
# 🛠 Infrastructure Orchestration (Longhorn via Helm Chart)
# ------------------------------------------------------------------------------
helmCharts:
- name: longhorn
  repo: https://charts.longhorn.io
  releaseName: longhorn
  namespace: longhorn-system
  version: v1.5.3 # Especific Version for reproducible deployments
  valuesFile: ../../longhorn/base/values.yaml # Configuration Helm Charm
